name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Lint modules and generated configs
        run: python tools/sysmonlint.py modules dist
      - name: Generated configs are up to date
        run: python tools/sysmongen.py build --check

  reference-data:
    name: Reference data matches pinned ATT&CK and Sigma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned sources
        run: |
          ATTACK=$(python -c "import json; print(json.load(open('data/versions.json'))['attack'])")
          SIGMA=$(python -c "import json; print(json.load(open('data/versions.json'))['sigma'])")
          git clone -q --depth 1 --branch "$ATTACK" --filter=blob:none --sparse \
            https://github.com/mitre-attack/attack-stix-data "$RUNNER_TEMP/attack"
          git -C "$RUNNER_TEMP/attack" sparse-checkout set --no-cone /enterprise-attack/enterprise-attack.json
          git clone -q --depth 1 --branch "$SIGMA" --filter=blob:none --sparse \
            https://github.com/SigmaHQ/sigma "$RUNNER_TEMP/sigma"
          git -C "$RUNNER_TEMP/sigma" sparse-checkout set rules/windows
      - name: Check data/
        run: python tools/refdata.py --attack "$RUNNER_TEMP/attack" --sigma "$RUNNER_TEMP/sigma" --check

  sysmon-load:
    name: Load configs into Sysmon
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply every generated config and module with sysmon -c
        shell: pwsh
        run: ./testing/Test-SysmonLoad.ps1 -Path dist, modules
      - name: Probe which mistakes Sysmon rejects (informational)
        if: always()
        shell: pwsh
        run: ./testing/Test-SysmonLoad.ps1 -Path testing/probes -OutputDirectory sysmon-load-results/probes -Probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sysmon-load-results
          path: sysmon-load-results/

  powershell:
    name: PowerShell analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer (errors)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($findings) { exit 1 }
