name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish generated configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Verify before publishing
        run: |
          python -m pytest -q tests
          python tools/sysmonlint.py modules dist
          python tools/sysmongen.py build --check
      - name: Checksums
        working-directory: dist
        run: sha256sum sysmon-*.xml catalog.json coverage.md > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/sysmon-*.xml dist/catalog.json \
            dist/coverage.md dist/SHA256SUMS \
            --title "sysmon-config $GITHUB_REF_NAME" --generate-notes --verify-tag
